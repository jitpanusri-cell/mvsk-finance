<style>
.pw-tabs{margin-bottom:16px}

.pw-tag.alert{color:#A1261C;background:#FCE8E6;border-color:#F3CFCB}
.pw-tag.finance-alert{color:#6B4A0E;background:#FFF4DB;border-color:#F2DDAA}
.pw-tag.supplies-alert{color:#1C6B42;background:#E3F2E9;border-color:#BFE0CB}
.pw-tag.plan-alert{color:#1d4ed8;background:#e8f0fd;border-color:#c7d7fb}.pw-tag.bank-alert{color:#0e7490;background:#e0f5f9;border-color:#b6e3ec}.pw-tag.control-alert{color:#6d28d9;background:#f1eafe;border-color:#d9c8fb}.pw-tag.office-alert{color:#475467;background:#f2f4f7;border-color:#d0d5dd}
.pw-tag.general{color:#1F3A5F;background:#E8EEF6;border-color:#CBD7E8}
.pw-tag.document{color:#4A3F8F;background:#EFEDFB;border-color:#D8D3F5}
.pw-tag.on{color:#1C6B42;background:#E3F2E9;border-color:#BFE0CB}
.pw-tag.off{color:#5B6678;background:#F1F2F4;border-color:#DCDFE4}
.pw-tag.exp{color:#A1261C;background:#FCE8E6;border-color:#F3CFCB}

.pw-act{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}

.pw-ib.on{color:var(--gold);border-color:var(--gold);background:#FFF8E8}

.pw-ib .i{width:17px;height:17px}
.pw-ord{display:flex;flex-direction:column;gap:2px}
.pw-ord .pw-ib{width:28px;height:22px}
tr.pw-dim td{opacity:.6}
.pw-slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pw-slide{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pw-slide.dim{opacity:.6}
.pw-slide .ty{position:absolute;right:10px;top:10px;background:#fff;color:var(--ink);font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px}
.pw-slide .im{aspect-ratio:16/9;background:#EEF1F6 center/cover no-repeat;position:relative}

.pw-slide .bd{padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.pw-slide .bd .grow{flex:1;min-width:0}
.pw-slide .bd .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-slide .bd .s{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-tb{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:6px;background:#FAFBFC}
.pw-tb .pw-ib{border-color:transparent;background:transparent}
.pw-tb .pw-ib:hover{background:#fff;border-color:var(--line)}

.pw-tb input[type=color]{width:34px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.pw-ed{min-height:200px;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:0 0 10px 10px;padding:12px 14px;line-height:1.7;font-size:15px}
.pw-ed:focus{outline:2px solid #2F6FEB;outline-offset:-2px}
.pw-ed ul,.pw-ed ol{padding-left:1.4em}
.pw-ed:empty::before{content:attr(data-ph);color:var(--ink3)}
.pw-img{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pw-img .pv{width:200px;border:1px dashed var(--line);border-radius:10px;background:#FAFBFC center/cover no-repeat;display:grid;place-items:center;color:var(--ink3);flex:none;font-size:12.5px;text-align:center}
.pw-img .pv.news{aspect-ratio:4/3}
.pw-gal{display:flex;flex-wrap:wrap;gap:10px}
.pw-gal .g{position:relative;width:150px;aspect-ratio:4/3;border-radius:10px;background:#EEF1F6 center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
.pw-gal .g.up{display:grid;place-items:center;font-size:12.5px;color:var(--ink2)}
.pw-gal .g .cv{position:absolute;left:6px;top:6px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px}
.pw-gal .g .bt{position:absolute;right:4px;bottom:4px;display:flex;gap:3px}
.pw-gal .g .bt button{width:26px;height:26px;border:0;border-radius:7px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);cursor:pointer}
.pw-gal .g .bt button .i{width:14px;height:14px}
.pw-gal .none{color:var(--ink3);font-size:13.5px;padding:8px 0}
.pw-img .pv.slide{aspect-ratio:16/9}
.pw-lrow{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin-bottom:8px;align-items:center}
.pw-lrow .b{display:flex;gap:4px}
.pw-empty{text-align:center;padding:36px 12px;color:var(--ink2)}
@media (max-width:700px){.pw-lrow{grid-template-columns:1fr}.pw-hide-m{display:none}}

function pwCrop(file, w, h, cb) {
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const r = Math.max(w / img.width, h / img.height), sw = w / r, sh = h / r;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', .86));
    };
    img.onerror = () => toast('อ่านไฟล์รูปไม่ได้', true);
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

    });
  };
}

    pwCrop(f, 1000, 750, data => {
      rawApi('pwUpload', data, f.name.replace(/\.\w+$/, '') + '.jpg')
        .then(r => { if (r && r.url) PW.imgs.push(r.url); }, e => toast('อัปโหลด ' + f.name + ' ไม่สำเร็จ: ' + e.message, true))
        .finally(() => { PW.uploading--; pwRenderGal(); });
    });
  });
};

function pwLinkRow(name, url) {
  if ($('pwLinks').children.length >= 6) return toast('สูงสุด 6 ไฟล์', true);
  $('pwLinks').insertAdjacentHTML('beforeend', `<div class="pw-lrow"><input class="inp ln" placeholder="ชื่อปุ่ม เช่น ประกาศ (PDF)" value="${esc(name || '')}">
    <input class="inp lu" placeholder="ลิงก์ไฟล์ Google Drive" value="${esc(url || '')}">
    <div class="b"><button type="button" class="pw-ib" data-lu>${ic('up')}</button><button type="button" class="pw-ib" data-ld>${ic('down')}</button><button type="button" class="pw-ib del" data-lx>${ic('x')}</button></div></div>`);
}
$('pwAddLink').onclick = () => pwLinkRow();
$('pwLinks').onclick = e => {
  const r = e.target.closest('.pw-lrow'); if (!r) return;
  if (e.target.closest('[data-lx]')) r.remove();
  else if (e.target.closest('[data-lu]') && r.previousElementSibling) r.after(r.previousElementSibling);
  else if (e.target.closest('[data-ld]') && r.nextElementSibling) r.before(r.nextElementSibling);
};
$('pwTb').addEventListener('mousedown', e => { if (e.target.closest('.pw-ib')) e.preventDefault(); });
$('pwTb').onclick = e => {
  const b = e.target.closest('[data-cmd]'); if (!b) return;
  let v = null;
  if (b.dataset.cmd === 'createLink') { v = prompt('วางลิงก์'); if (!v) return; }
  document.execCommand(b.dataset.cmd, false, v); $('pwBody').focus();
};
$('pwSize').onchange = function () { if (this.value) { $('pwBody').focus(); document.execCommand('fontSize', false, this.value); } this.value = ''; };
$('pwColor').onchange = function () { $('pwBody').focus(); document.execCommand('foreColor', false, this.value); };
$('pwBody').addEventListener('paste', e => {
  const html = e.clipboardData && e.clipboardData.getData('text/html'); if (!html) return;
  e.preventDefault();
  const d = document.createElement('div'); d.innerHTML = html;
  d.querySelectorAll('script,style,meta,link,img,iframe').forEach(x => x.remove());
  d.querySelectorAll('*').forEach(x => ['class', 'style', 'id'].forEach(k => x.removeAttribute(k)));
  document.execCommand('insertHTML', false, d.innerHTML);
});

function pwOpenNews(a) {
  PW.edit = a;
  $('pwNewsH').textContent = a ? 'แก้ไขประกาศ' : 'สร้างประกาศ';
  $('pwTitle').value = a ? a.title : '';
  $('pwType').value = a ? a.type : 'general';
  const y = a ? pwYmd(a.date) : PW.data.today;
  $('pwDate').value = y || ''; $('pwDate').dataset.raw = a && !y ? a.date : '';
  $('pwExp').value = a ? a.expire : '';
  $('pwBody').innerHTML = a ? a.details : '';
  PW.imgs = a ? (a.images || []).slice() : []; PW.uploading = 0; $('pwImg').value = ''; pwRenderGal();
  $('pwLinks').innerHTML = ''; (a ? a.links : []).forEach(l => pwLinkRow(l.name, l.url)); if (!a) pwLinkRow();
  $('pwVis').checked = a ? !a.isHidden : true; $('pwPin').checked = a ? a.pinned : false;
  modal('pwNewsModal').show();
}
$('pwDate').onchange = function () { this.dataset.raw = ''; };
$('pwNewsForm').onsubmit = e => {
  e.preventDefault();
  const links = [...$('pwLinks').children].map(r => ({ name: r.querySelector('.ln').value.trim(), url: r.querySelector('.lu').value.trim() })).filter(l => l.name || l.url);
  if (links.some(l => !l.name || !/^https?:/i.test(l.url))) return toast('ไฟล์แนบต้องมีชื่อปุ่มและลิงก์ที่ขึ้นต้นด้วย https', true);
  const o = {
    id: PW.edit ? PW.edit.id : '', title: $('pwTitle').value, type: $('pwType').value,
    date: $('pwDate').dataset.raw || pwThai($('pwDate').value), expire: $('pwExp').value,
    details: $('pwBody').innerHTML.trim(), imageUrl: PW.imgs.join('\n'), links: links,
    isHidden: !$('pwVis').checked, pinned: $('pwPin').checked
  };
  $('pwNewsSave').disabled = true;
  pwRun('pwSaveNews', o).then(() => { modal('pwNewsModal').hide(); toast('บันทึกแล้ว'); return pwReload(); }).finally(() => $('pwNewsSave').disabled = false);
};

function pwOpenSlide(s) {
  PW.edit = s;
  $('pwSlideH').textContent = s ? 'แก้ไขสไลด์' : 'เพิ่มสไลด์';
  $('pwSImg').value = s ? s.imageUrl : ''; $('pwSFile').value = ''; pwSetPv($('pwSImgPv'), $('pwSImg').value);
  $('pwSTitle').value = s ? s.title : ''; $('pwSSub').value = s ? s.subtitle : '';
  $('pwSLink').value = s ? s.link : ''; $('pwSLinkT').value = s ? s.linkText : '';
  $('pwSVis').checked = s ? !s.isHidden : true;
  modal('pwSlideModal').show();
}
$('pwSlideForm').onsubmit = e => {
  e.preventDefault();
  const o = { id: PW.edit ? PW.edit.id : '', imageUrl: $('pwSImg').value.trim(), title: $('pwSTitle').value, subtitle: $('pwSSub').value,
    link: $('pwSLink').value.trim(), linkText: $('pwSLinkT').value, isHidden: !$('pwSVis').checked };
  if (!o.imageUrl) return toast('กรุณาเลือกรูป', true);
  $('pwSlideSave').disabled = true;
  pwRun('pwSaveSlide', o).then(() => { modal('pwSlideModal').hide(); toast('บันทึกแล้ว'); return pwReload(); }).finally(() => $('pwSlideSave').disabled = false);
};

function pwOpenFin(s) {
  PW.edit = s;
  const pay = pwK() === 'pay', sup = PW.tab === 'sup', sec = pay ? 'ขั้นตอนชำระเงิน' : sup ? $('pwGrp').selectedOptions[0].textContent : 'งานการเงินและบัญชี';
  $('pwFinH').textContent = (s ? 'แก้ไขรายการ ' : 'เพิ่มรายการ ') + sec;
  $('pwFType').closest('.col-sm-4').hidden = sup || pay; $('pwFDate').closest('.col-sm-4').hidden = pay; $('pwFLink').closest('.col-sm-8').hidden = sup; $('pwFLinkT').closest('.col-sm-4').hidden = sup;
  $('pwFFileL').textContent = pay ? 'รายละเอียด * (ขึ้นบรรทัดใหม่ได้)' : sup ? 'ลิงก์เอกสาร / โฟลเดอร์ *' : 'ลิงก์ไฟล์ Google Drive * (แชร์ให้ทุกคนที่มีลิงก์ดูได้)';
  const y = s ? pwYmd(s.date) : PW.data.today;
  $('pwFDate').value = y || ''; $('pwFDate').dataset.raw = s && !y ? s.date : '';
  $('pwFType').value = s ? s.type : 'video'; $('pwFTitle').value = s ? s.title : ''; $('pwFFile').value = s ? s.fileUrl : '';
  $('pwFLink').value = s ? s.link : ''; $('pwFLinkT').value = s ? s.linkText : ''; $('pwFVis').checked = s ? !s.isHidden : true;
  modal('pwFinModal').show();
}
$('pwFDate').onchange = function () { this.dataset.raw = ''; };
$('pwFinForm').onsubmit = e => {
  e.preventDefault();
  const o = { id: PW.edit ? PW.edit.id : '', type: $('pwFType').value, date: $('pwFDate').dataset.raw || pwThai($('pwFDate').value), title: $('pwFTitle').value.trim(), fileUrl: $('pwFFile').value.trim(),
    link: $('pwFLink').value.trim(), linkText: $('pwFLinkT').value.trim(), isHidden: !$('pwFVis').checked };
  if (!o.title || !o.fileUrl) return toast('กรุณาใส่หัวข้อและลิงก์ไฟล์', true);
  $('pwFinSave').disabled = true;
  pwRun('pwSaveFin', o, pwK()).then(() => { modal('pwFinModal').hide(); toast('บันทึกแล้ว'); return pwReload(); }).finally(() => $('pwFinSave').disabled = false);
};
</script>
